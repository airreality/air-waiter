[project]
name = "air-waiter"
version = "1.3.0"
description = "Waiter"
authors = [
    {name = "Anton Ryazantsev", email = "airunreality@gmail.com"}
]
maintainers = [
    {name = "Anton Ryazantsev", email = "airunreality@gmail.com"}
]
license = {text = "MIT License"}
readme = "README.md"
requires-python = ">=3.12"
urls.Source = "https://github.com/airreality/air-waiter"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-cov>=6.1.1",
    "pytest-mock>=3.14.0",
    "ruff>=0.15.18",
    "ty>=0.0.52",
]
types = [
    "types-colorama>=0.4.15.20240311",
    "types-pexpect>=4.9.0.20250516",
    "types-pygments>=2.19.0.20250516",
    "types-setuptools>=75.8.0.20250110",
]

[build-system]
requires = ["uv_build>=0.11.8,<0.12"]
build-backend = "uv_build"
